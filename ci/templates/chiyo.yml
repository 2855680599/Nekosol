name: CHIYO component and Hermes integration checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      - run: uv sync --frozen --python '${{ matrix.python }}' --extra dev --extra messaging --extra web
        working-directory: vendor/hermes
      - run: vendor/hermes/.venv/bin/python scripts/test.py
      - run: vendor/hermes/.venv/bin/python scripts/test_alpha.py
